name: Build article pages & sitemap

# Turns the articles published in the admin panel into plain HTML pages (read/<slug>, en/read/<slug>),
# sitemap.xml and RSS feeds so Google can index them. Runs every 15 minutes and on demand
# (GitHub -> Actions -> "Build article pages & sitemap" -> Run workflow).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/build_static.mjs"
      - "js/config.js"
      - "js/md.js"

permissions:
  contents: write

concurrency:
  group: build-static
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build
        run: node tools/build_static.mjs
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "VOSB Builder"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Auto-build article pages, sitemap and feeds [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes."
          fi
