<body>
  <div id="site-top"></div>
  <noscript><div class="noscript-bar">Voice of Startup Bangladesh — please enable JavaScript. <a href="/">Home</a> · <a href="/news">News</a> · <a href="/about">About</a> · <a href="/contact">Contact</a> · <a href="/careers">Careers</a> · <a href="/privacy-policy">Privacy</a> · <a href="/terms-of-service">Terms</a></div></noscript>
  <main>
    <section class="page-hero"><div class="container">
      <p class="eyebrow" data-bn="যোগাযোগ" data-en="Contact"></p>
      <h1 data-bn="আমাদের সাথে <span class='g'>যোগাযোগ</span> করুন" data-en="Get in <span class='g'>touch</span>"></h1>
      <p data-bn="নিউজ টিপস, পার্টনারশিপ বা যেকোনো প্রশ্নে ইমেইল করুন।" data-en="Email us for news tips, partnerships or any question."></p>
    </div></section>
    <section class="section"><div class="container">
      <div class="mail-grid" id="mail-cards"></div>
      <h2 style="margin:48px 0 18px" data-bn="মেসেজ পাঠান" data-en="Send a message"></h2>
      <form class="form-card" id="contact-form">
        <label data-bn="কাকে পাঠাবেন" data-en="Send to"></label>
        <select name="to">
          <option value="hello@voiceofstartup.bd">hello@voiceofstartup.bd</option>
          <option value="editor@voiceofstartup.bd">editor@voiceofstartup.bd</option>
          <option value="partnerships@voiceofstartup.bd">partnerships@voiceofstartup.bd</option>
          <option value="rakib@voiceofstartup.bd">rakib@voiceofstartup.bd</option>
          <option value="careers@voiceofstartup.bd">careers@voiceofstartup.bd</option>
        </select>
        <label data-bn="আপনার নাম" data-en="Your name"></label>
        <input name="name" required>
        <label data-bn="আপনার ইমেইল" data-en="Your email"></label>
        <input name="email" type="email" required>
        <label data-bn="বিষয়" data-en="Subject"></label>
        <input name="subject">
        <label data-bn="বার্তা" data-en="Message"></label>
        <textarea name="message" required></textarea>
        <p style="margin-top:18px"><button class="btn btn-orange" type="submit" data-bn="ইমেইল অ্যাপে পাঠান" data-en="Send via email app"></button></p>
      </form>
    </div></section>
  </main>
